[project]
name = "reel"
version = "0.1.0"
description = "A small self-hosted video server for a homelab"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "ffmpeg: needs ffmpeg/ffprobe installed",
    "browser: real server + headless Chromium (slow; run with -m browser)",
]
addopts = "-m 'not browser'"
